[OPTIONS]
# Tutorial 10 -- O'Brien Continuous Synthesis Protocol (CSP), ported to topo.
# Run:  topo-csp -f csp.ini      (equivalently:  python -m topo.csp -f csp.ini)
#
# UNITS: OpenMM defaults -- length nm, time ps, energy kJ/mol, temperature K,
# force constants kJ/mol/nm^2. In-vivo dwell times below are in SECONDS.

# ---- inputs (topo-native: a PDB + topo's own CG builder, like tutorials 07/09) ----
pdb_file   = P0CX28_clean.pdb
ribosome   = ribosome_trunc.pdb
domain_def = domain.yaml
stride_output_file = P0CX28_clean_stride.dat

# ---- O'Brien codon kinetics ----
# Per-residue translation time comes from the mRNA codon + this time table.
mrna        = P0CX28_mrna.txt        # one codon per residue (+ 1 stop)
trans_times = trans_times.txt        # codon -> mean in-vivo time (s); Fluitt E. coli
scale_factor = 4331293               # in-vivo seconds -> in-silico ns compressor
time_stage_1 = 0.00034               # mean peptidyl-transfer dwell (s)
time_stage_2 = 0.004201              # mean translocation dwell (s)
# stage 3 (tRNA binding) = codon total - time_stage_1 - time_stage_2
ribosome_traffic = no                # external traffic binary (off; falls back if unavailable)
initiation_rate  = 0.083333          # 1/s (used only if ribosome_traffic = yes)
random_seed = 20240628               # reproducible FPT sampling

# ---- elongation schedule ----
L0    = 5
L_max =                            # short range for the demo (blank = full 106)

# ---- TEST CLAMP: keep each residue to ~2000 steps so the demo runs fast ----
# Production: delete these two lines so step counts follow the kinetics
# (a real residue is ~10^5-10^6 steps).
max_steps_per_stage = 667            # ~3 x 667 = ~2000 steps per amino acid
min_steps_per_stage = 50

# ---- integrator / output frequency ----
dt     = 0.015
ref_t  = 300
tau_t  = 0.01
nstout = 200

# ---- elongation mechanics ----
constraints = None
restraint_k = 83680
buffer      = 0.4
minimize    = yes

# ---- ribosome forces (build step v2, same as tutorial 07) ----
rigid_ribosome      = yes
tunnel_wall         = yes
tunnel_wall_x0      = 1.05
tunnel_wall_k       = 8368
nascent_only_output = yes

# ---- post-synthesis phases (steps; 0 = skip) ----
ejection_steps     = 667             # release the restraint; chain leaves the tunnel
dissociation_steps = 0               # set > 0 to add a free drift-off run

# ---- hardware / output ----
device = GPU
ppn    = 4
outdir = synth_out
