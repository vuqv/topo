# ---------------------------------------------------------------------------
# Tutorial A.7 — a protein with intrinsically disordered regions (IDRs).
# P28566 (365 residues): one folded domain + an N-terminal tail and a long
# intracellular loop marked disordered in domain.yaml. See README.md.
# ---------------------------------------------------------------------------

# ---- system input & force field ----
pdb_file = P28566.pdb
model = topo                       ; the only model currently supported
domain_def = domain.yaml           ; folded domain A (nscale 2.5044) + `disordered:` regions
stride_output_file = P28566_stride.dat   ; precomputed STRIDE (H-bonds); remove this line to
                                         ; run STRIDE automatically instead.

# ---- integration & bonds ----
# Demo length. The disordered regions need much longer to sample a converged
# ensemble; for production increase md_steps (the validation run used 1_000_000)
# and prefer a GPU.
md_steps = 100_000     ; number of integration steps (short demo)
dt = 0.015             ; time step in ps

# ---- thermostat (temperature coupling / Langevin) ----
tcoupl = yes
ref_t = 300            ; Kelvin
tau_t = 0.05           ; ps^-1 (friction / coupling time constant)

# ---- periodic boundaries & pressure ----
pcoupl = no            ; single protein in vacuum, no pressure coupling
pbc = no               ; no periodic box / solvent

# ---- output & reporting ----
output_dir = traj
outname = traj
nstxout = 1000         ; trajectory frame / checkpoint every N steps
nstlog = 1000          ; log line every N steps
log_precision = 4
log_width = 14

# ---- initial state, restart & minimization ----
restart = no
# minimize = no: the folded core starts from the AlphaFold structure. The
# disordered regions are NOT at the model's energy minimum (their native
# contacts are removed), so they carry some initial force and relax over the
# first steps -- this is expected; the early relaxation is discarded in analysis.
minimize = no

# ---- hardware ----
device = CPU           ; runs anywhere; set to GPU for the full-length run
ppn = 4                ; CPU threads (only used when device = CPU)
