# Mixed folded + disordered definition for P28566 (365 residues).
#
# P28566 (5-HYDROXYTRYPTAMINE RECEPTOR 1E) modelled from its AlphaFold structure.
# The chain is treated as ONE folded domain plus two intrinsically disordered
# regions (IDRs): the N-terminal tail and a long intracellular loop.
#
#   intra_domains.A  -- the folded core; `nscale` scales its sidechain-sidechain
#                       native contacts. 2.5044 is used here as a reasonable
#                       default; for quantitative work calibrate it with the
#                       nscale optimizer (Tutorial A.5).
#   disordered       -- residues whose native contacts are REMOVED and replaced
#                       by a weak, non-specific attraction (idr_scale, default
#                       0.03). These regions relax to a disordered ensemble
#                       instead of holding the AlphaFold conformation.
#
# NOTE on ranges: where a domain range and a disordered range touch (e.g. the
# domain boundary at residue 18, and 218-219 / 279-281), the disordered residues
# WIN -- the model prints an "IDR overlap" info line and treats those residues as
# disordered. See https://vuqv.github.io/topo/usage/disordered_regions.html and
# .../domain_definition.html for the full format and the overlap rule.

n_residues: 365
intra_domains:
  A:
    residues: [18-164, 177-219, 279-363]
    nscale: 2.5044
disordered:
  residues: [1-18, 218-281]     # N-terminal tail + long intracellular loop
  idr_scale: 0.03               # weak IDR-IDR attraction (default; 0 = self-avoiding)
