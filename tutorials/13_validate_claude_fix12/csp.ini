[OPTIONS]
# Tutorial 12_auto -- O'Brien Continuous Synthesis Protocol (CSP) on the 4c5c
# system, reproduced in topo-style.  Run:  topo-csp -f csp.ini
#
# This file maps continuous_synthesis/input/cont_synth_ecoli.cntrl onto topo.csp.
# UNITS: OpenMM defaults -- nm, ps, kJ/mol, K, kJ/mol/nm^2.  Dwell times in SECONDS.
#
# >>> DEBUG PROFILE (fast) <<<  see NOTES.md for the production profile.
#   scale_factor is 50x the production value and step counts are clamped so the
#   whole 1..L_max pipeline runs in a few minutes for a green end-to-end check.

# ---- inputs (topo-native CG build from the all-atom PDB, like tutorials 07/09/10) ----
pdb_file           = 4c5c_model_clean.pdb
ribosome           = ribosome_trunc.pdb
domain_def         = domain.yaml
stride_output_file = 4c5c_model_clean_stride.dat

# ---- O'Brien codon kinetics  (<- cont_synth_ecoli.cntrl) ----
mrna         = 4c5c_mrna.txt          # 4c5c_mrna_sequence_fast.txt (reference's fast mRNA)
trans_times  = trans_times.txt        # Fluitt E. coli codon times (= setup/Fluitt_...)
scale_factor = 216564650              # DEBUG: 4331293 * 50 (production = 4331293)
time_stage_1 = 0.000340               # peptidyl-transfer mean dwell (s)  <- time_stage_1
time_stage_2 = 0.004201               # translocation mean dwell (s)      <- time_stage_2
ribosome_traffic = no                 # ref=1, but the traffic binary is unavailable here
initiation_rate  = 0.083333           # 1/s  <- initiation_rate
random_seed  = 20240629               # reproducible FPT sampling

# ---- elongation schedule  (<- start/total_nascent_chain_length) ----
L0    = 1                             # <- start_nascent_chain_length
L_max = 20                             # DEBUG short range (reference total = 10)

# ---- DEBUG step clamp (delete both for production codon-driven step counts) ----
max_steps_per_stage = 500
min_steps_per_stage = 50

# ---- integrator / output frequency ----
dt     = 0.015                        # <- Time step 0.015 ps
ref_t  = 310                          # <- temp_prod = 310
tau_t  = 0.01
nstout = 50                           # debug: fine output (ref File save steps = 5000)

# ---- elongation mechanics ----
constraints = None
restraint_k = 83680
buffer      = 0.4
minimize    = yes

# ---- ribosome forces (build step v2) ----
rigid_ribosome      = yes
tunnel_wall         = yes
tunnel_wall_x0      = 1.05
tunnel_wall_k       = 8368
nascent_only_output = yes

# ---- post-synthesis phases (steps; 0 = skip) ----
ejection_steps     = 500              # release restraint; chain leaves the tunnel (+x)
dissociation_steps = 0

# ---- hardware / output ----
device = GPU
ppn    = 4
outdir = synth_out_debug
