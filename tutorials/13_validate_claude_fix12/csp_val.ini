[OPTIONS]
# Tutorial 12_auto -- VALIDATION profile (D6): reproduce the reference
# continuous_synthesis run (length 1 -> 10) with PRODUCTION kinetics.
# Run:  topo-csp -f csp_val.ini
#
# Difference from csp.ini (debug): production scale_factor = 4331293, L_max = 10.
# A high max_steps_per_stage cap bounds the rare ~1e6-step stages so the MD stays
# tractable on one GPU; the cap does NOT change the sampled dwell times in SECONDS
# (it only truncates how many MD steps a stage integrates), so the D6 dwell-time
# comparison against the reference is unaffected.  Documented in NOTES.md.

pdb_file           = 4c5c_model_clean.pdb
ribosome           = ribosome_trunc.pdb
domain_def         = domain.yaml
stride_output_file = 4c5c_model_clean_stride.dat

mrna         = 4c5c_mrna.txt
trans_times  = trans_times.txt
scale_factor = 216564650                # PRODUCTION (matches reference cntrl)
time_stage_1 = 0.000340
time_stage_2 = 0.004201
ribosome_traffic = no                 # ref=1; traffic binary unavailable here
initiation_rate  = 0.083333
random_seed  = 20240629

L0    = 1
L_max = 306                            # == reference total_nascent_chain_length

max_steps_per_stage = 10000          # documented cap (see header)
min_steps_per_stage = 400

dt     = 0.015
ref_t  = 310
tau_t  = 0.01
nstout = 200

constraints = None
restraint_k = 83680
buffer      = 0.4
minimize    = yes

rigid_ribosome      = yes
tunnel_wall         = yes
tunnel_wall_x0      = 1.05
tunnel_wall_k       = 8368
nascent_only_output = yes

ejection_steps     = 50000
dissociation_steps = 0

device = GPU
ppn    = 4
outdir = synth_out
