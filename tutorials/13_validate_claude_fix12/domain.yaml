# Domain definition for 4c5c (306 residues), mapped from the O'Brien CG model.
#
# Source: protein_cg_model/domain_def.dat (cg_simtk format) + the structural
# domain grouping in continuous_synthesis/input/setup/domain_def.dat:
#
#     1:84              -> domain A
#     85:110 184:306    -> domain B  (discontiguous)
#     111:183           -> domain C
#
# The cg_simtk file lists the protein as FOUR contiguous segments
#   D1=1-84  D2=85-110  D3=184-306  D4=111-183
# with 10 Go-scaling factors (4 intra + 6 inter):
#   intra:  D1 D2 D3 D4 = 1.1556 1.1556 1.1556 1.1556
#   inter:  D1-D2 D1-D3 D1-D4 D2-D3 D2-D4 D3-D4
#         = 2.1670 2.1670 1.2747 1.1556 2.1670 2.1670
#
# Collapsing the two B-segments (D2,D3) into one structural domain is
# self-consistent: D2-D3 = 1.1556 = the intra value, and D1-D2 = D1-D3 = 2.1670,
# D2-D4 = D3-D4 = 2.1670, so the 3-domain mapping below loses no information.
#
# `strength` multiplies the sidechain-sidechain native-contact energies (topo's
# Go scaling), the same role nscal plays in the O'Brien/cg_simtk `bt` model.

n_residues: 306
intra_domains:
  A: { residues: [1-84],          strength: 1.1556 }
  B: { residues: [85-110, 184-306], strength: 1.1556 }
  C: { residues: [111-183],       strength: 1.1556 }
inter_domains:
  A-B: 2.1670
  A-C: 1.2747
  B-C: 2.1670
