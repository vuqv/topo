# ---------------------------------------------------------------------------
# Minimal config for the nscale optimizer (optimization.py).
#
# ONE flat section. The optimizer takes the keys it needs (ntraj, q_threshold,
# frame_fraction, max_rounds, min_contacts); every other key is a simulation
# parameter passed through to each round's md.ini. Everything not set here
# (dt, model, thermostat, pcoupl, pbc, device, ppn, minimize, output naming, ...)
# uses the optimizer's implicit protocol defaults — see IMPLICIT_DEFAULTS in
# optimization.py. Each round the optimizer expands this into a full
# round_N/md.ini and writes round_N/domain.yaml with the current nscales.
# ---------------------------------------------------------------------------

# ---- inputs (paths relative to this file) ----
pdb_file   = P0A6E6.pdb        ; all-atom reference (native contacts + geometry)
domain_def = domain.yaml       ; initial domains + class; the nscales get optimized

# ---- per-trajectory production (simulation parameters -> md.ini) ----
md_steps   = 50000           ; steps per trajectory (~0.075 us at dt=0.015 ps;
                               ;   the published protocol uses ~0.5 us -> ~3.3e7)
nstxout    = 100              ; trajectory output frequency (frames feed Q)
nstlog     = 100
ref_t      = 300               ; K; stability protocol temperature

# Override an implicit default by adding it here, e.g. to run on CPU:
# device   = CPU

# Optional: skip running STRIDE entirely by pointing at a precomputed file.
# If omitted, the optimizer runs STRIDE once (round 1) and reuses the result for
# later rounds. STRIDE depends only on the structure, so it never changes here.
# stride_output_file = P0A6E6_stride.dat

# ---- optimizer controls (consumed by optimization.py; all optional, defaults shown) ----
ntraj          = 10            ; independent trajectories per round (= n_copies)
q_threshold    = 0.6688        ; a frame is "folded" for a unit if Q > this
frame_fraction = 0.98          ; a trajectory is "stable" if >= this fraction folded
max_rounds     = 6             ; 5 ladder levels + median fallback. A protein that
                               ;   is still unstable after 6 rounds is flagged with
                               ;   a WARNING in the report (you may exclude it).
min_contacts   = 0             ; a domain/interface with fewer native contacts than
                               ;   this is too weakly structured to fold: it is pinned
                               ;   at the first ladder level and NOT optimized.
                               ;   0 (default) disables the check.
