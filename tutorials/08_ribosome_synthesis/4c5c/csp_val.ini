# Standalone 4c5c CSP -- FULL-LENGTH validation (L=1->306) + post-synthesis ejection.
# STANDALONE: ribosome = topo's own CG truncated PDB (ribosome_trunc.pdb), loaded via
# load_ribosome from model_parameters -- NO O'Brien .cor/.psf/.prm. Mirrors tut15 csp_val.ini
# but on the standalone ribosome. 50x scale_factor keeps it tractable; logged dwell times are
# in seconds and scale-independent.
# Run:  topo-csp -f csp_val.ini   -> synth_out/   (watch for NO "[stability]" lines)

# --- inputs ---
pdb_file           = 4c5c_model_clean.pdb
ribosome           = ribosome_trunc.pdb
domain_def         = domain.yaml
stride_output_file = 4c5c_model_clean_stride.dat

# --- length schedule ---
L0    = 1
L_max = 306

# --- codon-resolved kinetics ---
mrna         = 4c5c_mrna.txt
codon_times  = trans_times.txt   ; table path = per-codon timing (or a positive number of s = uniform)
scale_factor = 216564650
time_stage_1 = 0.000340
time_stage_2 = 0.004201
random_seed  = 20240629
max_steps_per_stage = 2000       ; testing-only clamp (DELETE for production)
min_steps_per_stage = 100        ; testing-only clamp (DELETE for production)

# --- integrator / MD mechanics ---
dt     = 0.015
ref_t  = 310
tau_t  = 0.05
nstout = 100
constraints = AllBonds
minimize    = yes

# --- post-synthesis phases (run stall -> ejection) + resume ---
stall_steps        = 0       # hold at the PTC (restraint ON) before ejection; 0 -> skip
ejection_steps     = 20000

# --- hardware / output ---
device = GPU
ppn    = 4
outdir = synth_out
