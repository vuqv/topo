[OPTIONS]
# Tutorial 15 (claude_fix) / P0CX28 -- FULL-LENGTH profile (L=1->106).
# The claude-fix path (equilibrium-PTC + rigid AllBonds, no dt-halving), full length, with
# post-synthesis ejection. Mirrors ../csp_val.ini (4c5c) but for P0CX28 (106 residues,
# single-domain, nscale 2.5044). There is NO O'Brien reference run for P0CX28, so D6
# (quantitative match) does not apply -- report internal consistency instead (see NOTES.md).
# Run:  topo-csp -f csp_val.ini   -> synth_out/

pdb_file           = P0CX28_clean.pdb
ribosome           = ribosome_trunc.pdb
domain_def         = domain.yaml
stride_output_file = P0CX28_clean_stride.dat

mrna         = P0CX28_mrna.txt
codon_times  = trans_times.txt   ; table path = per-codon timing (or a positive number of s = uniform)
scale_factor = 216564650
time_stage_1 = 0.000340
time_stage_2 = 0.004201
random_seed  = 20240629

L0    = 1
L_max = 106

max_steps_per_stage = 2000
min_steps_per_stage = 100

dt     = 0.015
ref_t  = 310
tau_t  = 0.05
nstout = 100

optimize_ptc_geometry = yes
constraints            = AllBonds
restraint_k = 83680
buffer      = 0.4
minimize    = yes

ejection_steps     = 20000
dissociation_steps = 0

device = GPU
ppn    = 4
outdir = synth_out

