[OPTIONS]
# Protein synthesis through an ANALYTIC exit tunnel -- the "cylinder"
# ribosome model (topo tutorial 09).
#
# Replaces the explicit ribosome beads of the CSP tutorials (12/13) with a
# cylindrical bore drilled through an infinite wall (a "hole in an infinite wall").
# The System is the nascent chain only -- fast, no bead clashes/jamming -- and the
# analytic tunnel confines the in-tunnel segment so the chain stays extended and
# threads out the exit. Because the chain carries topo's native Go contacts, it can
# fold co-translationally once it clears the bore.
#
# Timing is the SAME O'Brien codon kinetics as topo-csp -- each residue's MD length
# comes from its codon dwell time (mrna + scale_factor below) -- but with a single MD
# segment per residue (the cylinder has no A/P translocation to split into stages).
#
# Run from this folder:
#   topo-cylinder -f cylinder.ini
#   python -m topo.csp.cylinder -f cylinder.ini

# --- inputs (paths relative to the working directory) ---
pdb_file   = P0CX28_clean.pdb               # full native PDB of the nascent chain (106 res)
domain_def = domain.yaml                     # contact nscale (one-time precompute)
stride_output_file = P0CX28_clean_stride.dat # precomputed STRIDE (skips running it)
# NOTE: no `ribosome` PDB -- the tunnel is analytic (geometry from the params below).

# --- elongation schedule ---
L0         = 1               # starting nascent-chain length (cold-start layout)
L_max      =                 # final length (blank -> full residue count, 106)

# --- kinetics (same as topo-csp; sets each residue's MD length from its codon) ---
mrna         = P0CX28_mrna.txt   # per-codon sequence (one codon per residue)
# codon_times: path to a per-codon mean-time table (required for per-codon timing).
# Here the E. coli 310 K table from the shared library; codon_times also accepts a
# positive number of seconds = a uniform codon time.
codon_times  = ../../assets/csp/codon_dwell_times/ecoli/ecoli_codon_dwell_times_310K.txt
scale_factor = 216564650         # DEBUG: 4331293 * 50 (production = 4331293). Larger -> fewer steps.
time_stage_1 = 0.000340          # peptidyl-transfer mean dwell (s)
time_stage_2 = 0.004201          # translocation mean dwell (s)
random_seed  = 20240629          # reproducible dwell-time sampling
# Demo clamps on the per-residue MD segment (DELETE both for a production run):
max_steps_per_stage = 2000       # cap steps/residue (keeps the demo fast)
min_steps_per_stage = 50         # floor steps/residue

# --- mechanics ---
constraints = None           # flexible harmonic bonds (AllBonds also works: the new
                             # residue is seeded one equilibrium bond from its neighbour)
restraint_k = 83680          # C-terminus -> PTC restraint (kJ/mol/nm^2)
minimize    = yes

# --- integrator ---
dt         = 0.015
ref_t      = 300
tau_t      = 0.05
nstout     = 100

# --- analytic exit tunnel ---
tunnel_radius      = 0.9        # bore radius r (nm); ~3 CG beads wide
tunnel_length      = 10.0       # bore length (nm); x_exit = x_lo + length = 10.0
tunnel_x_lo        = 0.0        # PTC / closed end (nm); C-terminus seeded on-axis here
tunnel_center      = 0.0, 0.0   # tunnel axis (y0, z0) (nm); axis = X-axis
tunnel_k           = 8368       # wall stiffness (kJ/mol/nm^2 = 20 kcal/mol/A^2)
tunnel_mouth_round = 0.2        # mouth-corner fillet radius rho (nm)

# --- post-synthesis free runs (after the chain reaches full length) ---
# Same keys as topo-csp. Each phase releases the C-terminus restraint so the finished
# protein diffuses out the tunnel exit (the bore + closed PTC end stay on, so the only
# way out is +x) and folds in the cytosol. Written to <outdir>/ejection/ and
# <outdir>/dissociation/.
ejection_steps     = 300_000   # 0 -> skip; use a LONG run so the protein can clear the tunnel
dissociation_steps = 0         # 0 -> skip; continued free run (protein drifts off)

# --- hardware / output ---
device     = GPU
ppn        = 4
outdir     = synth_out
