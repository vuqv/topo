[OPTIONS]
# ---------------------------------------------------------------------------
# Tutorial 3, STAGE 1 (md.ini): run an initial short simulation, then continue
# it from the checkpoint with md_restart.ini. This file is the FIRST stage.
# See README.md for the two-stage walkthrough and the output-file guide.
# ---------------------------------------------------------------------------

# ---- system input & force field ----
pdb_file = P0CX28_clean.pdb
model = topo

# ---- integration & bonds ----
md_steps = 5000
dt = 0.015

# ---- thermostat (temperature coupling / Langevin) ----
tcoupl = yes
ref_t = 300
tau_t = 0.05

# ---- periodic boundaries & pressure ----
pcoupl = no
pbc = no

# ---- output & reporting ----
# Outputs go to <output_dir>/<outname>.* (defaults: traj/traj.*).
; output_dir = traj
; outname = traj
nstxout = 500
nstchk = 1000        ; checkpoint every N steps (optional; defaults to nstxout)
nstlog = 500
nstcomm = 1000

# ---- initial state, restart & minimization ----
restart = no
minimize = no

# ---- hardware ----
device = CPU
ppn = 4
