[OPTIONS]
# ---------------------------------------------------------------------------
# Tutorial 3, STAGE 2 (md_restart.ini): CONTINUE the simulation from the
# checkpoint produced by stage 1. The two things that matter for a restart:
#   * restart = yes        -> load positions/velocities from the checkpoint
#   * md_steps             -> the TOTAL target step count (not the extra steps)
# Here md_steps = 10000 means "run until 10000 total", i.e. 5000 more steps
# beyond the 5000 already done in stage 1.
# Keep output_dir / outname / pdb_file IDENTICAL to stage 1 (so the restart finds
# the same traj/traj.chk and appends to the same traj/traj.log and traj/traj.dcd).
# ---------------------------------------------------------------------------

md_steps = 10000       # TOTAL steps (5000 already done + 5000 more)
dt = 0.015
nstxout = 500
nstlog = 500
nstcomm = 1000
model = topo

tcoupl = yes
ref_t = 300
tau_t = 0.01

pcoupl = no
pbc = no

pdb_file = P0CX28_clean.pdb
# Outputs go to <output_dir>/<outname>.* (defaults: traj/traj.*).
; output_dir = traj
; outname = traj

device = CPU
ppn = 4

restart = yes          # <-- the key change; minimize is forced off on restart
