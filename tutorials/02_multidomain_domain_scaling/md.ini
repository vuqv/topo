[OPTIONS]
# ---------------------------------------------------------------------------
# Tutorial 2: multidomain protein (adenylate kinase, 1AKE chain A) with
# per-domain contact-energy scaling via domain.yaml. Short, CPU-friendly run.
# See README.md for the walkthrough and the domain.yaml explanation.
# ---------------------------------------------------------------------------

md_steps = 5000_000
dt = 0.015             ; time step in ps
nstxout = 5000          ; trajectory / checkpoint frequency
nstlog = 5000           ; log frequency
nstcomm = 1000
model = topo

tcoupl = yes
ref_t = 300            ; Kelvin
tau_t = 0.01           ; ps^-1

pcoupl = no
pbc = no

# ---- input ----
pdb_file = 1AKE_A.pdb
domain_def = domain.yaml   ; THIS is what makes it multidomain-aware
# no stride_output_file -> STRIDE runs automatically (writes 1AKE_A_stride.dat)

# ---- output ----
# Outputs go to <output_dir>/<outname>.* (defaults: traj/traj.*).
; output_dir = traj
; outname = traj

# ---- hardware ----
device = GPU
ppn = 4

# ---- run control ----
restart = no
minimize = no          ; native structure is already the Go-model energy minimum
