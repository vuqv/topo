# ---------------------------------------------------------------------------
# Tutorial 6: temperature annealing -- DELTA (T-jump) QUENCH.
#
# Hold the protein at a high (unfolding) temperature so it loses its native
# structure, then INSTANTANEOUSLY drop the thermostat to ref_t and watch it
# refold at a single, well-defined temperature. This is the standard Go-model
# folding-kinetics protocol. See README.md for the full walkthrough.
#
# Short, demo-sized settings so it finishes in a few seconds. NOTE: tau_t is
# deliberately large here (fast thermostat coupling) so the system reaches
# t_high within the short hold; production runs use a much smaller tau_t and
# therefore need a proportionally longer `anneal_steps` (see README).
# ---------------------------------------------------------------------------

# ---- system input & force field ----
pdb_file = P0CX28_clean.pdb
model = topo
domain_def = domain.yaml   ; calibrated contact nscale (stable at 300 K, unfolds at 600 K)

# ---- integration & bonds ----
md_steps = 3_000       # PRODUCTION steps at ref_t (separate from the quench; see anneal_steps)
dt = 0.015             ; time step in ps

# ---- thermostat (temperature coupling / Langevin) -- REQUIRED for annealing ----
tcoupl = yes
ref_t = 300            ; Kelvin -- this is the LOW / refold temperature (reused as-is)
tau_t = 1.0            ; ps^-1 friction. Large = fast coupling (demo). Production: ~0.05.

# ---- temperature protocol: delta quench ----
# Two phases: a QUENCH phase (this hold at t_high) writes traj_quench.dcd/.log,
# then a PRODUCTION phase (md_steps at ref_t) writes traj.dcd/.log. The T-jump
# to ref_t lands exactly on the boundary between the two files.
anneal = yes           ; turn on the annealing protocol (default: no = constant ref_t)
t_high = 600           ; Kelvin -- high/unfolding temperature to hold before quenching
anneal_steps = 3_000   ; QUENCH-phase steps held at t_high (separate from md_steps)
anneal_ramp = jump     ; jump = instantaneous drop t_high -> ref_t (vs. linear; see README)

# ---- periodic boundaries & pressure ----
# pressure / PBC: off for a single folded protein in vacuum
pcoupl = no
pbc = no

# ---- output & reporting ----
output_dir = traj_jump
outname = traj
nstxout = 100          ; write a trajectory frame / checkpoint every N steps
nstlog = 100           ; write a log line every N steps (so the T-jump is visible)
log_precision = 4
log_width = 14

# ---- initial state, restart & minimization ----
restart = no
minimize = no          ; native input is already the model's energy minimum

# ---- hardware ----
device = GPU           ; set to CPU to run anywhere
ppn = 4
