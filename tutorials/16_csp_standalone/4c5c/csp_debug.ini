[OPTIONS]
# Standalone 4c5c CSP -- DEBUG smoke profile (L=1->8).
# STANDALONE: the ribosome is topo's own CG truncated PDB (ribosome_trunc.pdb), loaded via
# load_ribosome from model_parameters -- NO O'Brien .cor/.psf/.prm. Ribose bead = C1'..C5'
# centroid (O'Brien's set); RNA/ribosomal-protein Rmin/2 = O'Brien values in model_parameters;
# nascent Rmin/2 = per-residue K-B (Option A). Confirms the standalone path runs + is stable.
# Run:  topo-csp -f csp_debug.ini

pdb_file           = 4c5c_model_clean.pdb
ribosome           = ribosome_trunc.pdb
domain_def         = domain.yaml
stride_output_file = 4c5c_model_clean_stride.dat

mrna         = 4c5c_mrna.txt
trans_times  = trans_times.txt
scale_factor = 216564650
time_stage_1 = 0.000340
time_stage_2 = 0.004201
random_seed  = 20240629

L0    = 1
L_max = 8

max_steps_per_stage = 2000
min_steps_per_stage = 400
nstout              = 200

dt     = 0.015
ref_t  = 310
tau_t  = 0.01

optimize_ptc_geometry = yes
constraints            = AllBonds
restraint_k = 83680
buffer      = 0.4
minimize    = yes

ejection_steps     = 0
dissociation_steps = 0

device = GPU
ppn    = 4
outdir = synth_out_debug
