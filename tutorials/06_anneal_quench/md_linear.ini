[OPTIONS]
# ---------------------------------------------------------------------------
# Tutorial 6: temperature annealing -- LINEAR (slow-cool) RAMP.
#
# Hold at t_high, then cool GRADUALLY to ref_t over many small temperature
# steps, then hold at ref_t. Slow cooling maximizes refolding yield and avoids
# kinetic traps (classic simulated annealing toward the native minimum), but it
# convolves cooling with folding, so it is NOT for clean kinetics -- use the
# delta quench (md.ini) for that. See README.md.
#
# Demo-sized settings; same fast-coupling caveat about tau_t as md.ini.
# ---------------------------------------------------------------------------

# ---- system input & force field ----
pdb_file = P0CX28_clean.pdb
model = topo
domain_def = domain.yaml

# ---- integration & bonds ----
md_steps = 3_000       # PRODUCTION steps at ref_t (separate from the quench phase)
dt = 0.015

# ---- thermostat (temperature coupling / Langevin) ----
tcoupl = yes
ref_t = 300            ; LOW / refold temperature (ramp ends here)
tau_t = 1.0            ; fast coupling for the demo (production: ~0.05)

# ---- temperature protocol: linear cooling ramp ----
# Two phases: the QUENCH phase (hold at t_high + the cooling ramp down to ref_t)
# writes traj_quench.dcd/.log; the PRODUCTION phase (md_steps at ref_t) writes
# traj.dcd/.log. The quench phase here is anneal_steps + anneal_ramp_steps long.
anneal = yes
t_high = 600                 ; start (and hold) temperature
anneal_steps = 1_500         ; QUENCH-phase steps held at t_high before cooling starts
anneal_ramp = linear         ; cool gradually instead of jumping
anneal_ramp_steps = 3_000    ; QUENCH-phase steps spent ramping t_high -> ref_t
anneal_ramp_increments = 10  ; number of discrete temperature steps in the ramp
#                              (the final increment lands exactly on ref_t)

# ---- periodic boundaries & pressure ----
pcoupl = no
pbc = no

# ---- output & reporting ----
output_dir = traj_linear
outname = traj
nstxout = 100
nstlog = 100
log_precision = 4
log_width = 14

# ---- initial state, restart & minimization ----
restart = no
minimize = no

# ---- hardware ----
device = GPU
ppn = 4
