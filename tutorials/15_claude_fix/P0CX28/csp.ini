[OPTIONS]
# Tutorial 15 (claude_fix) / P0CX28 -- DEBUG smoke profile (L=1->8).
# Same claude-fix path as the 4c5c debug (equilibrium-PTC + rigid AllBonds, no dt-halving);
# confirms the fix is active + stable for P0CX28 before the full-length run.
# Writes ONLY to synth_out_debug/.  Run:  topo-csp -f csp.ini

pdb_file           = P0CX28_clean.pdb
ribosome           = ribosome_trunc.pdb
domain_def         = domain.yaml
stride_output_file = P0CX28_clean_stride.dat

mrna         = P0CX28_mrna.txt
trans_times  = trans_times.txt
scale_factor = 216564650
time_stage_1 = 0.000340
time_stage_2 = 0.004201
random_seed  = 20240629

L0    = 1
L_max = 8

max_steps_per_stage = 2000
min_steps_per_stage = 400
nstout              = 200

dt     = 0.015
ref_t  = 310
tau_t  = 0.01

equil_peptide_geometry = yes
constraints            = AllBonds
restraint_k = 83680
buffer      = 0.4
minimize    = yes

ejection_steps     = 0
dissociation_steps = 0

device = GPU
ppn    = 4
outdir = synth_out_debug
