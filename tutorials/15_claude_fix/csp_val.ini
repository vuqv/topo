[OPTIONS]
# Tutorial 15 (claude_fix) -- FULL-LENGTH validation profile for 4c5c (L=1->306).
# The claude-fix path (equilibrium-bond PTC geometry + rigid AllBonds, no dt-halving),
# full length, with post-synthesis ejection. Mirrors tut14c csp_4c5c.ini.
# A 50x scale_factor keeps the run tractable; the per-residue in-vivo dwell times logged
# in dwell_times.dat are in SECONDS and are independent of scale_factor (so the D6
# dwell comparison vs the O'Brien reference is unaffected -- scale_factor and the step
# caps bound only the MD step count per stage, not the sampled dwell).
# Run:  topo-csp -f csp_val.ini   -> synth_out/   (watch for NO "[stability]" lines)

pdb_file           = 4c5c_model_clean.pdb
ribosome           = ribosome_obrien.cor
domain_def         = domain.yaml
stride_output_file = 4c5c_model_clean_stride.dat

mrna         = 4c5c_mrna.txt
trans_times  = trans_times.txt
scale_factor = 216564650              # 50x production (4331293) -> ~50x fewer MD steps (quick full run)
time_stage_1 = 0.000340
time_stage_2 = 0.004201
random_seed  = 20240629

L0    = 1
L_max = 306                           # full protein

max_steps_per_stage = 2000            # cap each stage (quick); does not change sampled dwell times
min_steps_per_stage = 100

dt     = 0.015
ref_t  = 310
tau_t  = 0.01
nstout = 100

# --- the claude fix (explicit ON; D1: no equil_peptide_geometry=no, no constraints=None) ---
equil_peptide_geometry = yes
constraints            = AllBonds
restraint_k = 83680
buffer      = 0.4
minimize    = yes

ejection_steps     = 20000            # post-synthesis: release restraint, eject down +x
dissociation_steps = 0

device = GPU
ppn    = 4
outdir = synth_out
