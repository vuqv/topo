[OPTIONS]
# Tutorial 15 (claude_fix) -- DEBUG smoke profile for 4c5c.
# Short run (small L_max, 50x scale_factor, CPU) to confirm the claude-fix path is
# ACTIVE and stable before the full-length validation: equilibrium-bond PTC geometry
# + rigid AllBonds, with the dt-halving guard NEVER firing and the seed peptide bond
# born at ~3.81 A. Writes ONLY to synth_out_debug/ (never the reference outputs).
# Run:  topo-csp -f csp.ini

pdb_file           = 4c5c_model_clean.pdb
ribosome           = ribosome_obrien.cor
domain_def         = domain.yaml
stride_output_file = 4c5c_model_clean_stride.dat

mrna         = 4c5c_mrna.txt
trans_times  = trans_times.txt
scale_factor = 216564650              # 50x production (4331293) -> ~50x fewer MD steps (quick debug)
time_stage_1 = 0.000340               # O'Brien peptidyl-transfer mean dwell (s)
time_stage_2 = 0.004201               # O'Brien translocation mean dwell (s)
random_seed  = 20240629

L0    = 1
L_max = 8                             # short: enough residues to see seeding + A->P migration

max_steps_per_stage = 2000            # AGENTS.md §6 debug cap
min_steps_per_stage = 400             # honest stability floor (vs 100 in tut14) -- surface blow-ups
nstout              = 200             # ~5-10 frames/stage for analyze_validation.py D5/D5b

dt     = 0.015
ref_t  = 310
tau_t  = 0.01

# --- the claude fix (explicit ON; satisfies D1: no equil_peptide_geometry=no, no constraints=None) ---
equil_peptide_geometry = yes          # optimal A/P PTC targets 0.381 nm apart (one peptide bond)
constraints            = AllBonds      # rigid bonds (O'Brien-faithful); seedable via the geometry
restraint_k = 83680
buffer      = 0.4
minimize    = yes

ejection_steps     = 0
dissociation_steps = 0

device = GPU
ppn    = 4
outdir = synth_out_debug
