[OPTIONS]
# Tutorial 15 (claude_fix) -- §1b feature ✅2/✅3 TEST: O'Brien tRNA tether + orientation.
# Same DEBUG profile as csp.ini but with trna_tether = yes: the C-terminus is held by the
# O'Brien aminoacyl-/peptidyl-tRNA linkage (bond + 2 orienting angles + improper to the tRNA
# R/P/PU2 beads; A-site stages 1-2, P-site stage 3) instead of an isotropic position spring,
# and the previous residue (L-1) is also tethered to the P-site in stage 1 (feature 3).
# Goal: check it stays stable + measure whether orientation control reduces the clash /
# changes dwell/geometry vs the position-restraint baseline. Writes to synth_out_tether/.
# Run:  topo-csp -f csp_tether.ini

pdb_file           = 4c5c_model_clean.pdb
ribosome           = ribosome_obrien.cor
domain_def         = domain.yaml
stride_output_file = 4c5c_model_clean_stride.dat

mrna         = 4c5c_mrna.txt
trans_times  = trans_times.txt
scale_factor = 216564650
time_stage_1 = 0.000340
time_stage_2 = 0.004201
random_seed  = 20240629

L0    = 1
L_max = 8

max_steps_per_stage = 2000
min_steps_per_stage = 400
nstout              = 200

dt     = 0.015
ref_t  = 310
tau_t  = 0.01

equil_peptide_geometry = yes
constraints            = AllBonds
trna_tether            = yes          # §1b ✅2/✅3: O'Brien tRNA tether + orientation
restraint_k = 83680
buffer      = 0.4
minimize    = yes

ejection_steps     = 0
dissociation_steps = 0

device = GPU
ppn    = 4
outdir = synth_out_tether
