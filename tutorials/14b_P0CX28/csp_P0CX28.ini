[OPTIONS]
# Tutorial 14b -- P0CX28 full-length continuous synthesis with the STEP-2 setup:
# equilibrium-bond PTC geometry + rigid AllBonds (no dt-halving). Mirrors
# 14_obrien_topo_consistency/csp_step2_allbonds.ini but for P0CX28 (106 residues),
# full length, with a 50x-higher scale_factor for a quick run.
# Run:  topo-csp -f csp_P0CX28.ini

pdb_file           = P0CX28_clean.pdb
ribosome           = ribosome_trunc.pdb
domain_def         = domain.yaml
stride_output_file = P0CX28_clean_stride.dat

mrna         = P0CX28_mrna.txt
trans_times  = trans_times.txt
scale_factor = 216564650              # 50x the production 4331293 -> ~50x fewer MD steps (quick)
time_stage_1 = 0.000340
time_stage_2 = 0.004201
random_seed  = 20240629

L0    = 1
L_max = 106                           # full protein

max_steps_per_stage = 2000            # cap each stage (quick); does not change sampled dwell times
min_steps_per_stage = 100

dt     = 0.015
ref_t  = 310
tau_t  = 0.01
nstout = 500

# --- step-2 geometry (opt-in): seed new residue 0.381 nm from the previous C-terminus
# at the optimal A-site target, so a rigid AllBonds build is stable at 15 fs. ---
optimize_ptc_geometry = yes
constraints            = AllBonds
restraint_k = 83680
buffer      = 0.4
minimize    = yes

ejection_steps     = 0
dissociation_steps = 0

device = GPU
ppn    = 4
outdir = synth_out
