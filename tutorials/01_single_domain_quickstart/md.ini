[OPTIONS]
# ---------------------------------------------------------------------------
# Tutorial 1: minimal single-domain run. Short, CPU-friendly settings so it
# finishes in well under a minute on a laptop. See README.md for the walkthrough.
# ---------------------------------------------------------------------------

md_steps = 5000        # number of integration steps (short, for a quick demo)
dt = 0.015             ; time step in ps
nstxout = 500          ; write a trajectory frame / checkpoint every N steps
nstlog = 500           ; write a log line every N steps
nstcomm = 1000         ; remove center-of-mass motion every N steps
model = topo           ; the only model currently supported

# temperature coupling (Langevin thermostat)
tcoupl = yes
ref_t = 300            ; Kelvin
tau_t = 0.01           ; ps^-1 (friction / coupling time constant)

# pressure coupling: off for a single folded protein in vacuum
pcoupl = no

# periodic boundary conditions: off (no solvent box needed for one globular chain)
pbc = no

# ---- input ----
protein_code = P0CX28      ; prefix used for all output files
pdb_file = P0CX28_clean.pdb
# NOTE: no domain_def here -> all sidechain-sidechain contacts scaled by 1.0
# NOTE: no stride_output_file here -> STRIDE is run automatically (writes
#       P0CX28_clean_stride.dat) because `stride` is on your PATH.

# ---- output ----
checkpoint = P0CX28.chk

# ---- hardware ----
device = CPU           ; use CPU so the tutorial runs anywhere (set to GPU if available)
ppn = 4                ; CPU threads (only used when device = CPU)

# ---- run control ----
restart = no
# minimize = no: the input is the native crystal structure, which is already the
# energy minimum of the structure-based (Go) model, so pre-minimization is not
# needed. (Leave this off unless you start from a perturbed/non-native structure.)
minimize = no
