[OPTIONS]
# ---------------------------------------------------------------------------
# Tutorial 1: minimal single-domain run. Short, CPU-friendly settings so it
# finishes in well under a minute on a laptop. See README.md for the walkthrough.
# ---------------------------------------------------------------------------

# ---- system input & force field ----
pdb_file = P0CX28_clean.pdb
model = topo           ; the only model currently supported
domain_def = domain.yaml   ; single domain with a CALIBRATED contact nscale (2.5044).
                           ; For one domain this is just a global scale on the SS contacts;
                           ; it is tuned so the model is realistically stable at 300 K.
# NOTE: no stride_output_file here -> STRIDE is run automatically (writes
#       P0CX28_clean_stride.dat) because `stride` is on your PATH.

# ---- integration & bonds ----
md_steps = 3_000        # number of integration steps (short, for a quick demo)
dt = 0.015             ; time step in ps

# ---- thermostat (temperature coupling / Langevin) ----
tcoupl = yes
ref_t = 300            ; Kelvin
tau_t = 0.05           ; ps^-1 (friction / coupling time constant)

# ---- periodic boundaries & pressure ----
# pressure coupling: off for a single folded protein in vacuum
pcoupl = no
# periodic boundary conditions: off (no solvent box needed for one globular chain)
pbc = no

# ---- output & reporting ----
# Outputs go to <output_dir>/<outname>.* (defaults: traj/traj.*).
output_dir = traj
outname = traj
nstxout = 50          ; write a trajectory frame / checkpoint every N steps
nstlog = 50           ; write a log line every N steps
; nstcomm = 10         ; remove center-of-mass motion every N steps
log_precision = 4     ; decimal places for float columns in the .log (default 4)
log_width = 14        ; min column width for aligned, fixed-width .log (default 14)

# ---- initial state, restart & minimization ----
; init_position = traj/traj_final.pdb   ; optional: start from these coordinates
;                                       ; instead of pdb_file (e.g. a previous run's
;                                       ; final frame). Defaults to pdb_file.
restart = no
# minimize = no: the input is the native crystal structure, which is already the
# energy minimum of the structure-based (Go) model, so pre-minimization is not
# needed. (Leave this off unless you start from a perturbed/non-native structure.)
minimize = no

# ---- hardware ----
device = GPU           ; use CPU so the tutorial runs anywhere (set to GPU if available)
ppn = 4                ; CPU threads (only used when device = CPU)
