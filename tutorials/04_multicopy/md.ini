[OPTIONS]
# ---------------------------------------------------------------------------
# Tutorial 4: run MANY non-interacting copies of one chain in a single
# simulation to fill the GPU and collect N independent trajectories at once.
# The standard run_simulation.py handles this automatically via n_copies below;
# afterwards split per-chain trajectories with split_chains.py. See README.md.
# ---------------------------------------------------------------------------

md_steps = 5000
dt = 0.015
nstxout = 500          ; trajectory / checkpoint frequency
nstlog = 500
nstcomm = 1000
model = topo

# ---- multi-copy ----
n_copies = 10          ; number of independent, non-interacting chains in one run
copy_shift = 5.0       ; nm, x-translation between copies at the start

tcoupl = yes
ref_t = 300
tau_t = 0.01

pcoupl = no
pbc = no

# ---- input ----
protein_code = P0CX28
pdb_file = P0CX28_clean.pdb
domain_def = domain.yaml   ; calibrated single-domain strength (2.5044)

# ---- output ----
checkpoint = P0CX28_x10.chk

# ---- hardware ----
# The whole point of this tutorial is GPU efficiency: set device = GPU on a CUDA
# machine. CPU is the portable default so the demo runs anywhere.
device = GPU
ppn = 4

restart = no
minimize = no
