[OPTIONS]
# ===========================================================================
# Tutorial 7: co-translational synthesis (the topo.translation elongation runner).
# Small/fast settings so it finishes in a few minutes on a CPU. Run from THIS
# folder (paths are relative to the current working directory):
#
#   cd tutorials/07_protein_synthesis
#   topo-elongate -f elongate.ini
#
# See README.md for the full walkthrough.
#
# UNITS: OpenMM defaults throughout -- length nm, time ps, energy kJ/mol,
# temperature K, angle rad, force constants kJ/mol/nm^2.
# ===========================================================================

# ---- inputs ----
pdb_file   = P0CX28_clean.pdb        ; full native PDB (the nascent chain, 106 res)
ribosome   = ribosome_trunc.pdb      ; truncated CG ribosome (P-/A-anchors + scenery)
domain_def = domain.yaml             ; contact nscale (one-time precompute)
stride_output_file = P0CX28_clean_stride.dat   ; precomputed STRIDE (skips running it)

# ---- elongation schedule ----
L0      = 30      ; starting nascent-chain length (cold-start layout)
L_max   =      ; final length (small for the tutorial; blank -> full 106)
n_steps = 2000   ; integration steps per residue (TINY for a demo; production ~840k)

# ---- integrator / output frequency ----
dt     = 0.015   ; time step (ps)
ref_t  = 300     ; temperature (K)
tau_t  = 0.05    ; Langevin friction / coupling constant (1/ps)
nstout = 500     ; trajectory / log / checkpoint write frequency

# ---- elongation mechanics ----
constraints = None   ; flexible harmonic bonds (required for the A->P seeding)
restraint_k = 83680  ; C-terminus restraint force constant (kJ/mol/nm^2; tether-off mode)
buffer      = 0.4    ; new-residue placement offset beyond the A-anchor (nm)
minimize    = yes    ; per-step energy minimization (relaxes the placement)

# ---- ribosome (build step v2) ----
rigid_ribosome   = yes    ; append the rigid (mass-0) ribosome + ribosome<->NC forces
trna_tether      = yes    ; tether C-terminus to the P-site tRNA (bond + CA-CA-tRNA angle)
tunnel_wall      = yes    ; one-sided wall: keep nascent chain at x >= tunnel_wall_x0
tunnel_wall_x0   = 1.05   ; wall plane (nm) = the C-terminal-AA addition plane (PTC);
                          ; keeps the chain at x >= x0 so it only extrudes forward (+x)
tunnel_wall_k    = 8368   ; wall force constant (kJ/mol/nm^2 = 20 kcal/mol/A^2)
nascent_only_output = yes ; write only the nascent chain (ribosome is static)

# ---- post-elongation phase ----
post_elongation       = ejection   ; release the tether after full length (or 'stallation')
post_elongation_steps = 2000_000       ; steps for the ejection/stallation run (0 = skip)

# ---- hardware / output ----
device = GPU
ppn    = 4
outdir = synth_out   ; per-length outputs go to synth_out/L_<L>/, plus ejection/
