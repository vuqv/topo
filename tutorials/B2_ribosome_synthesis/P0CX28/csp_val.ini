# Tutorial B.2 / P0CX28 -- FULL-LENGTH profile (L=1->106).
# Equilibrium-PTC + rigid AllBonds (no dt-halving), full length, with post-synthesis
# ejection. Mirrors ../4c5c/csp_val.ini but for P0CX28 (106 residues, single-domain,
# nscale 2.5044). There is NO O'Brien reference run for P0CX28, so a quantitative match
# against a reference does not apply -- judge the run on internal consistency instead.
# Run:  topo-csp -f csp_val.ini   -> synth_out/

# --- inputs ---
pdb_file           = P0CX28_clean.pdb
ribosome           = ribosome_trunc.pdb
domain_def         = domain.yaml
stride_output_file = P0CX28_clean_stride.dat

# --- length schedule ---
L0    = 1
L_max = 106

# --- codon-resolved kinetics ---
mrna         = P0CX28_mrna.txt
codon_times  = trans_times.txt   ; table path = per-codon timing (or a positive number of s = uniform)
scale_factor = 216564650
time_stage_1 = 0.000340
time_stage_2 = 0.004201
random_seed  = 20240629
max_steps_per_stage = 2000       ; testing-only clamp (DELETE for production)
min_steps_per_stage = 100        ; testing-only clamp (DELETE for production)

# --- integrator / MD mechanics ---
dt     = 0.015
ref_t  = 310
tau_t  = 0.05
nstout = 100
constraints = AllBonds
minimize    = yes

# --- post-synthesis phase + resume ---
ejection_steps     = 20000

# --- hardware / output ---
device = GPU
ppn    = 4
outdir = synth_out
