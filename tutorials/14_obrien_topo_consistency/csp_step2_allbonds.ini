[OPTIONS]
# Tutorial 14 -- STEP 2 TEST: equilibrium-bond PTC geometry + AllBonds, no dt-halving.
# Short debug run (L_max=5, small step cap, CPU) to see whether seeding the new
# residue one peptide bond (3.81 A) from the previous C-terminus lets a rigid
# AllBonds build run stable at 15 fs (the dt-halving guard should NOT fire).
# Run:  topo-csp -f csp_step2_allbonds.ini
#
# Writes to synth_out_step2/ (never the reference outputs).

pdb_file           = 4c5c_model_clean.pdb
ribosome           = ribosome_trunc.pdb
domain_def         = domain.yaml
stride_output_file = 4c5c_model_clean_stride.dat

mrna         = 4c5c_mrna.txt
trans_times  = trans_times.txt
scale_factor = 4331293
time_stage_1 = 0.000340
time_stage_2 = 0.004201
random_seed  = 20240629

L0    = 1
L_max = 5

max_steps_per_stage = 2000            # small cap: quick debug
min_steps_per_stage = 100

dt     = 0.015
ref_t  = 310
tau_t  = 0.01
nstout = 500

# Step-2 geometry: seed the new residue one peptide bond (3.81 A) from the previous
# C-terminus at the optimal A-site target, so a rigid AllBonds build is seedable at
# 15 fs without the dt-halving guard firing. Both keys are REQUIRED here (the geometry
# is opt-in; default is the old far-seed + flexible path used by tutorials 12 & 13).
equil_peptide_geometry = yes          # use optimal A/P targets 0.381 nm apart
constraints            = AllBonds      # rigid bonds (O'Brien-style); seedable via the geometry
restraint_k = 83680
buffer      = 0.4
minimize    = yes


ejection_steps     = 0
dissociation_steps = 0

device = CPU
ppn    = 4
outdir = synth_out_step2
