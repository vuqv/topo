# Single-domain definition for P0CX28 (106 residues).
#
# Even for a single-domain protein, the `nscale` is a meaningful calibration
# parameter: it is the global scale factor applied to the sidechain-sidechain
# native-contact energies. It is typically tuned so the model reproduces a target
# property (e.g. the experimental folding/melting temperature). Here 2.5044 is the
# calibrated value for P0CX28 -- using the raw, unscaled value of 1.0 would leave
# the protein under-stabilized and only marginally folded at 300 K.
#
# A single domain has no interfaces, so there is no `inter_domains` block.
# See https://vuqv.github.io/topo/usage/domain_definition.html for the full format.

n_residues: 106
intra_domains:
  A:
    residues: [1-106]
    nscale: 1.1556
