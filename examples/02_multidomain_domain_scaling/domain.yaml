# Domain definition for adenylate kinase (1AKE chain A), 214 residues.
#
# Domain A (the CORE + LID-flanking region) is DISCONTIGUOUS: it is made of two
# sequence segments, 1-117 and 166-214, that fold together in space. Domain B
# (118-165) is inserted between them in sequence.
#
# `strength` scales the sidechain-sidechain native-contact energy WITHIN a domain;
# the `inter_domains` entry scales contacts ACROSS the A/B interface.
# See ../../docs/usage/domain_definition.rst for the full reference.

n_residues: 214

intra_domains:
  A:
    residues: [1-117, 166-214]   # two segments, one domain
    strength: 1.1556
  B:
    residues: [118-165]
    strength: 1.6871

inter_domains:
  A-B: 1.8611                     # set to 0.0 to remove the interface; omitting the line keeps it at 1.0
