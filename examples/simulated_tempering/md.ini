# ---------------------------------------------------------------------------
# Base MD settings for the enhanced-sampling example in this folder.
# This folder is SELF-CONTAINED: the inputs below live right here.
#
# The temperature LADDER (tmin/tmax/nreplicas) is passed on the command line,
# NOT here -- ref_t below is ignored by the replica-exchange / tempering
# scripts.
# ---------------------------------------------------------------------------

# ---- system input & force field (local to this folder) ----
pdb_file = P0CX28_clean.pdb
model = topo
domain_def = domain.yaml
stride_output_file = P0CX28_clean_stride.dat

# ---- integration & bonds ----
md_steps = 100_000        # default run length (steps/replica) if --cycles omitted
dt = 0.015                ; ps

# ---- thermostat (Langevin) ----
tcoupl = yes
ref_t = 300               ; ignored: the ladder sets each replica's temperature
tau_t = 0.05              ; ps^-1 friction

# ---- periodic boundaries & pressure ----
pcoupl = no
pbc = no

# ---- output & reporting ----
output_dir = out
outname = remd
nstxout = 500
nstlog = 500
log_precision = 4
log_width = 14

# ---- initial state ----
restart = no
minimize = no

# ---- hardware ----
# CPU is portable and, for this 106-bead CG system, no slower than a GPU
# (the run is exchange-overhead-bound, not compute-bound). Set device = GPU
# for large systems.
device = CPU
ppn = 4
