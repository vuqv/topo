# ---- Stage 3 (fix_orient) landmarks ----
# PTC adenine N6 -> origin; PTC->exit vector -> +x; A/P tRNA tail vector -> +y.
# "ribose" = centroid of the ribose carbons C1'..C5' (matches cg_ribosome's R bead).
[orient]
oriented_out = ../out/ecoli/4v9d_50S_PtR_5jte_AtR_model_oriented.pdb
ptc    = 23S:2602:N6
exit   = L24:51:N
a_site = AtR:last:ribose
p_site = PtR:last:ribose
