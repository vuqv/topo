# E. coli 50S ribosome assembly (stage 2 config).
#
# Reproduces the shipped reference structure
#   topo/csp/structures/4v9d_50S_PtR_5jte_AtR_model.pdb
# The 50S large subunit + P-site tRNA come from the D-copy of PDB 4V9D (two 70S
# per asymmetric unit; the D-copy is the one used by the shipped file, confirmed
# by coordinate superposition -- the C-copy differs by ~0.4-1.5 A). The A-site
# tRNA is grafted from PDB 5JTE chain AW (4V9D lacks a resolved A-site tRNA).
#
# Chain map (4V9D auth chain -> segID) was determined by sequence + coordinate
# superposition against the shipped file; see PROVENANCE.md.

[assembly]
tag = 4v9d_50S_PtR_5jte_AtR
main_cif = ../raw/ecoli/4v9d.cif
out = ../out/ecoli/4v9d_50S_PtR_5jte_AtR_model.pdb
trna_segids = PtR,AtR

# ---- rRNAs ----
[mol:23S]
chain = DA
out_chain = B

[mol:5S]
chain = DB
out_chain = C

# ---- P-site tRNA (from 4V9D) ----
[mol:PtR]
chain = BV
out_chain = A

# ---- A-site tRNA (grafted from 5JTE, superposed via the large subunit) ----
[mol:AtR]
cif = ../raw/ecoli/5jte.cif
chain = AW
out_chain = 6
resrange = 2-76
superpose = lsu

# ---- large-subunit proteins (uL/bL) ----
