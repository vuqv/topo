<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="topo">
  <title>topo</title>
  <desc>Native contact map: self-contact diagonal with a symmetric beta-hairpin off-diagonal.</desc>
  <!-- contact-map frame -->
  <rect x="12" y="12" width="76" height="76" rx="16" fill="none" stroke="#0e8f86" stroke-width="4.5"/>
  <!-- self-contact diagonal -->
  <line x1="21" y1="21" x2="79" y2="79" stroke="#0e8f86" stroke-width="6" stroke-linecap="round"/>
  <!-- antiparallel beta-hairpin: two mirror streaks flanking the diagonal, gap at the turn -->
  <g fill="#d9891f">
    <circle cx="31" cy="59" r="4.5"/><circle cx="35" cy="55" r="4.5"/><circle cx="39" cy="51" r="4.5"/>
    <circle cx="59" cy="31" r="4.5"/><circle cx="55" cy="35" r="4.5"/><circle cx="51" cy="39" r="4.5"/>
  </g>
</svg>
